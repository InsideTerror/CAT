<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | CAT Corporation</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <img src="images/cat-mark.png" alt="CAT Corp. globe mark">
      <span>
        <span class="brand-text">CAT <span>CORP.</span></span>
        <span class="brand-sub">Employee Dashboard</span>
      </span>
    </a>
    <div class="user-info">
      <div class="who">
        <b id="user-name">User</b>
        <span class="role" id="user-role">Employee Access</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Secure Logout</button>
    </div>
  </div>
</nav>

<header class="page-head">
  <img class="hero-mark" src="images/cat-mark.png" alt="" aria-hidden="true">
  <div class="wrap">
    <div class="eyebrow">Internal Affairs</div>
    <h1>Employee Applications</h1>
    <p class="lede">Applications submitted through the public careers form.</p>
  </div>
</header>

<main class="section">
  <div class="wrap">
    <div class="grid grid-3" id="applications-container">
      <div class="empty-state"><p>Loading applications&hellip;</p></div>
    </div>
  </div>
</main>

<script type="module">
import { supabase } from './supabase-config.js';

const userNameElement = document.getElementById('user-name');
const userRoleElement = document.getElementById('user-role');
const applicationsContainer = document.getElementById('applications-container');

// Application rows come from a public form, so every value is escaped
// before it goes into innerHTML.
function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
}

function safeUrl(value) {
    try {
        const url = new URL(value);
        return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : null;
    } catch {
        return null;
    }
}

function emptyState(title, text) {
    applicationsContainer.innerHTML = `
        <div class="empty-state">
            <h3>${esc(title)}</h3>
            <p>${esc(text)}</p>
        </div>`;
}

async function loadAllApplications() {
    const { data: applications, error } = await supabase
        .from('applications')
        .select('*');

    if (error) return emptyState('Error loading applications', error.message);
    if (!applications || applications.length === 0) {
        return emptyState('No applications found', 'There are currently no job applications.');
    }

    applicationsContainer.innerHTML = applications.map(app => {
        const resume = safeUrl(app.resume_url);
        const applied = app.created_at ? new Date(app.created_at).toLocaleDateString() : 'Unknown';
        return `
            <article class="card">
                <span class="tag">Applicant</span>
                <h3>${esc(app.name)}</h3>
                <ul class="spec-list">
                    <li><span>Email</span><span><a href="mailto:${esc(app.email)}">${esc(app.email)}</a></span></li>
                    <li><span>Experience</span><span>${app.experience != null ? esc(app.experience) + ' yrs' : 'Not provided'}</span></li>
                    <li><span>Applied</span><span>${esc(applied)}</span></li>
                    ${resume ? `<li><span>Resume</span><span><a href="${esc(resume)}" target="_blank" rel="noopener noreferrer">Open &nearr;</a></span></li>` : ''}
                </ul>
            </article>`;
    }).join('');
}

document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('username');
    window.location.href = 'login.html';
});

// Module scripts run after the DOM is parsed, so this can run straight away.
const username = localStorage.getItem('isLoggedIn') ? localStorage.getItem('username') : null;

if (!username) {
    window.location.href = 'login.html';
} else {
    userNameElement.textContent = username;

    const { data: userData, error: userError } = await supabase
        .from('employees')
        .select('role')
        .eq('username', username)
        .maybeSingle();

    if (!userError && userData) {
        userRoleElement.textContent = userData.role || 'Employee';
    }

    if (username === 'Fritz_Teufel') {
        userRoleElement.textContent = 'CEO / Admin';
        loadAllApplications();
    } else {
        emptyState('Access restricted', 'You do not have permission to view applications.');
    }
}
</script>
</body>
</html>
