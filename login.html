<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Portal | CAT Corp</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="portal-body">

<main class="portal-card">
  <a href="index.html" class="brand">
    <img src="images/cat-mark.png" alt="CAT Corp. globe mark">
    <span>
      <span class="brand-text">CAT <span>CORP.</span></span>
      <span class="brand-sub">Secure Access Portal</span>
    </span>
  </a>

  <div class="form-error" id="login-error" role="alert"></div>
  <div class="form-success" id="login-success" role="status">Access granted. Redirecting&hellip;</div>

  <form id="login-form">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="Enter your username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn btn-block" id="login-btn">Access System</button>
  </form>
</main>

<a href="index.html" class="portal-back">&larr; Back to CAT Corp.</a>

<script type="module">
import { supabase } from './supabase-config.js';

const loginForm = document.getElementById('login-form');
const loginBtn = document.getElementById('login-btn');
const errorBox = document.getElementById('login-error');
const successBox = document.getElementById('login-success');

function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
}

loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username) return showError('Username is required');
    if (!password) return showError('Password is required');

    loginBtn.disabled = true;

    try {
        // NOTE: this compares a plain-text password stored in the `employees` table.
        // See README for why this should move to Supabase Auth.
        const { data, error } = await supabase
            .from('employees')
            .select('password')
            .eq('username', username)
            .maybeSingle();

        if (error || !data || data.password !== password) {
            showError('Invalid username or password');
            loginBtn.disabled = false;
            return;
        }

        loginForm.classList.add('hidden');
        successBox.classList.add('show');

        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('username', username);

        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
    } catch (err) {
        console.error('Login failed:', err);
        showError('Login failed. Please try again.');
        loginBtn.disabled = false;
    }
});
</script>
</body>
</html>
