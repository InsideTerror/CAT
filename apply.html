<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application | CAT Corp</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/cat_global_v1.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .form-container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-top: 8px solid #b91d1d; }
        .form-group { margin-bottom: 20px; }
        .row-flex { display: flex; gap: 20px; }
        .row-flex .form-group { flex: 1; }
        label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; font-family: 'Open Sans', sans-serif; }
        .id-display { font-weight: bold; color: #b91d1d; font-family: monospace; }
    </style>
</head>
<body onload="initForm()">
<nav class="navbar">
        <div class="logo">CAT<span>CORP.</span></div>
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-menu" id="navMenu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="companies.html">Companies</a></li>
            <li><a href="careers.html">Careers</a></li>
            <li class="dropdown">
                <a href="#">Products ▼</a>
                <ul class="dropdown-content">
                    <li><a href="sedans.html">S-Series</a></li>
                    <li><a href="pickups.html">P-Series</a></li>
                    <li><a href="trucks.html">T-Series</a></li>
                    <li><a href="buses.html">B-Series</a></li>
                </ul>
            </li>
        </ul>
    </nav>
    <div class="form-container">
        <div style="text-align: center; margin-bottom: 40px;">
            <p>APPLICATION ID: <span id="appID" class="id-display">GENERATING...</span></p>
            <h2 style="font-family: 'Playfair Display', serif;">Employment Application</h2>
        </div>

        <form id="applicationForm">
            <div class="row-flex">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label>Nationality</label>
                    <select id="nationality">
                        <option value="United States">United States</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Germany">Germany</option>
                        <option value="Japan">Japan</option>
                        <option value="Other">Other (C.O.R.E. Global)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Current Residence (City, Country)</label>
                <input type="text" id="residence" placeholder="e.g. New York, USA" required>
            </div>

            <div class="row-flex">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Target Department</label>
                    <select id="department">
                        <option value="Engineering">Engineering</option>
                        <option value="Legal">Legal Department</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Accounting">Accounting</option>
                        <option value="Security">Security</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Professional Summary</label>
                <textarea id="summary" rows="4"></textarea>
            </div>

            <button type="button" onclick="generatePDF()" class="btn-sub" style="width: 100%; border:none; cursor:pointer;">Generate Official Application PDF</button>
        </form>
    </div>

    <script>
        function initForm() {
            // 1. Generate Random ID
            const randomID = "CAT-" + Math.floor(1000 + Math.random() * 9000) + "-" + String.fromCharCode(65 + Math.floor(Math.random() * 26));
            document.getElementById('appID').innerText = randomID;

            // 2. Pre-select Department from URL
            const params = new URLSearchParams(window.location.search);
            const dept = params.get('dept');
            if (dept) {
                document.getElementById('department').value = dept;
            }
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const data = {
                id: document.getElementById('appID').innerText,
                name: document.getElementById('fullName').value,
                nation: document.getElementById('nationality').value,
                residence: document.getElementById('residence').value,
                email: document.getElementById('email').value,
                dept: document.getElementById('department').value,
                summary: document.getElementById('summary').value
            };

            // PDF Styling
            doc.setFillColor(26, 26, 26);
            doc.rect(0, 0, 210, 40, 'F');
            doc.setTextColor(185, 29, 29);
            doc.setFontSize(22);
            doc.text("CAT", 15, 25);
            doc.setTextColor(255, 255, 255);
            doc.text("CORP.", 33, 25);
            doc.setFontSize(10);
            doc.text("ID: " + data.id, 160, 25);

            // Body
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(14);
            doc.text("PERSONNEL APPLICATION DATA", 15, 55);
            doc.setDrawColor(185, 29, 29);
            doc.line(15, 58, 195, 58);

            doc.setFontSize(11);
            let y = 75;
            const fields = [
                ["Applicant Name:", data.name],
                ["Nationality:", data.nation],
                ["Residence:", data.residence],
                ["Contact Email:", data.email],
                ["Department:", data.dept]
            ];

            fields.forEach(field => {
                doc.setFont("helvetica", "bold");
                doc.text(field[0], 15, y);
                doc.setFont("helvetica", "normal");
                doc.text(field[1], 60, y);
                y += 10;
            });

            doc.setFont("helvetica", "bold");
            doc.text("Professional Summary:", 15, y + 5);
            doc.setFont("helvetica", "normal");
            const splitSummary = doc.splitTextToSize(data.summary, 180);
            doc.text(splitSummary, 15, y + 15);

            doc.save(`${data.id}_Application.pdf`);
        }

        function toggleMenu() {
            const navMenu = document.getElementById("navMenu");
            navMenu.classList.toggle("active");
        }
    </script>
</body>
</html>
