<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application | CAT Corp</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/cat_global_v1.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .form-container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-top: 8px solid #b91d1d; }
        .form-group { margin-bottom: 20px; }
        .row-flex { display: flex; gap: 20px; }
        .row-flex .form-group { flex: 1; }
        label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; font-family: 'Open Sans', sans-serif; }
        .id-display { font-weight: bold; color: #b91d1d; font-family: monospace; }
        .success-message { 
            background: #d4edda; 
            color: #155724; 
            padding: 15px; 
            border-radius: 4px; 
            margin: 20px 0;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body onload="initForm()">
<nav class="navbar">
        <div class="logo">CAT<span>CORP.</span></div>
        <div class="menu-toggle" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-menu" id="navMenu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="companies.html">Companies</a></li>
            <li><a href="careers.html">Careers</a></li>
            <li class="dropdown">
                <a href="#">Products ▼</a>
                <ul class="dropdown-content">
                    <li><a href="sedans.html">S-Series</a></li>
                    <li><a href="pickups.html">P-Series</a></li>
                    <li><a href="trucks.html">T-Series</a></li>
                    <li><a href="buses.html">B-Series</a></li>
                </ul>
            </li>
        </ul>
    </nav>
    <div class="form-container">
        <div style="text-align: center; margin-bottom: 40px;">
            <p>APPLICATION ID: <span id="appID" class="id-display">GENERATING...</span></p>
            <h2 style="font-family: 'Playfair Display', serif;">Employment Application</h2>
        </div>

        <div class="success-message" id="success-message">
            Application submitted successfully! Thank you for your interest.
        </div>

        <form id="applicationForm">
            <div class="row-flex">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label>Nationality</label>
                    <select id="nationality">
                        <option value="United States">United States</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Germany">Germany</option>
                        <option value="Japan">Japan</option>
                        <option value="Other">Other (C.O.R.E. Global)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Current Residence (City, Country)</label>
                <input type="text" id="residence" placeholder="e.g. New York, USA" required>
            </div>

            <div class="row-flex">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Target Department</label>
                    <select id="department">
                        <option value="Engineering">Engineering</option>
                        <option value="Legal">Legal Department</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Accounting">Accounting</option>
                        <option value="Security">Security</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Years of Experience</label>
                <input type="number" id="experience" min="0" max="50" required>
            </div>

            <div class="form-group">
                <label>Professional Summary</label>
                <textarea id="summary" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>Resume URL (optional)</label>
                <input type="url" id="resume" placeholder="https://example.com/resume.pdf">
            </div>

            <button type="button" onclick="submitApplication()" class="btn-sub" style="width: 100%; border:none; cursor:pointer;">
                Submit Application
            </button>
        </form>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        // Initialize Supabase
        const supabaseUrl = 'https://yjxohlqjqkdehbjnaxtf.supabase.co';
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqeG9obHFqcWtkZWhiam5heHRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTQyNjAsImV4cCI6MjA5MTQ5MDI2MH0.FGQoli-0ZtTANsZtKgH8jRyHxf_SauDCqULXmvnDqSQ";
        const supabase = createClient(supabaseUrl, supabaseKey);
        
        function initForm() {
            // 1. Generate Random ID
            const randomID = "CAT-" + Math.floor(1000 + Math.random() * 9000) + "-" + String.fromCharCode(65 + Math.floor(Math.random() * 26));
            document.getElementById('appID').innerText = randomID;

            // 2. Pre-select Department from URL
            const params = new URLSearchParams(window.location.search);
            const dept = params.get('dept');
            if (dept) {
                document.getElementById('department').value = dept;
            }
        }

        async function submitApplication() {
            // Get form data
            const name = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const experience = document.getElementById('experience').value;
            const resumeUrl = document.getElementById('resume').value;
            
            // Validate required fields
            if (!name || !email) {
                alert('Please fill in all required fields');
                return;
            }
            
            try {
                // Insert application into Supabase
                const { data, error } = await supabase
                    .from('applications')
                    .insert([
                        {
                            name: name,
                            email: email,
                            experience: experience,
                            resume_url: resumeUrl || null
                        }
                    ])
                    .select();
                
                if (error) throw error;
                
                // Show success message
                document.getElementById('applicationForm').style.display = 'none';
                document.getElementById('success-message').style.display = 'block';
                
                console.log('Application submitted:', data);
            } catch (error) {
                console.error('Error submitting application:', error);
                alert('Error submitting application. Please try again.');
            }
        }

        function toggleMenu() {
            const navMenu = document.getElementById("navMenu");
            navMenu.classList.toggle("active");
        }
        window.initForm = initForm;
window.submitApplication = submitApplication;
window.toggleMenu = toggleMenu;
    </script>
</body>
</html>
